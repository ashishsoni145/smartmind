name: Android app

# Build matrix for the SharpMind Android client.
#
#   verify          typecheck, JS tests, build-script security tests, source secret audit
#   android-debug   Kotlin unit tests + debug APK (Metro-based development workflow)
#   android-qa      standalone QA APK: bundled JS, production configuration, no Metro, debug-signed
#                   so it can be sideloaded on a physical device and tested with the computer off
#   android-release Play Store AAB: bundled JS, production configuration, signed with the upload
#                   keystore held only in GitHub secrets
#
# Secrets policy: signing credentials are consumed only by the signing step and are never echoed.
# The public client configuration (backend HTTPS URL, Supabase project URL, Supabase anon key) is
# committed in apps/mobile/config/production.json and may be overridden by repository variables or
# secrets. Nothing privileged is written into an artifact, and every artifact is scanned afterwards
# to prove it.

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'backend/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'backend/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      production_release:
        description: 'Build a Play-signed release AAB (requires SHARPMIND_KEYSTORE_* secrets; fails if they are missing)'
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests and source secret audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Mobile typecheck
        run: npm run mobile:typecheck

      - name: Mobile JS and build-script tests
        run: npm --prefix apps/mobile test

      - name: Auditor self test (prove the detectors detect)
        run: npm --prefix apps/mobile run audit:selftest

      - name: Secret audit of everything that can reach the bundle
        run: npm --prefix apps/mobile run audit:source -- --format github

      - name: Report the public client configuration (no secrets printed)
        run: npm --prefix apps/mobile run prepare:env

      - name: Web typecheck
        run: npm --prefix apps/web run typecheck

      - name: Backend typecheck
        run: npm --prefix backend run typecheck

      - name: Backend tests
        run: npm --prefix backend test

  android-debug:
    name: Kotlin tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    env:
      # Public client config. These are NOT secrets (a backend URL and the Supabase publishable
      # key), so a repository *variable* is the natural home - but the same name is also accepted
      # as a secret, because whoever configures the repository should not have to remember which
      # of the two it belongs in. The generator's own precedence is preserved: SHARPMIND_* wins
      # over NEXT_PUBLIC_*, and both win over apps/mobile/config/production.json.
      SHARPMIND_API_URL: ${{ vars.SHARPMIND_API_URL || secrets.SHARPMIND_API_URL }}
      SHARPMIND_SUPABASE_URL: ${{ vars.SHARPMIND_SUPABASE_URL || secrets.SHARPMIND_SUPABASE_URL }}
      SHARPMIND_SUPABASE_ANON_KEY: ${{ vars.SHARPMIND_SUPABASE_ANON_KEY || secrets.SHARPMIND_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      SHARPMIND_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Kotlin unit tests
        run: npm --prefix apps/mobile run test:android -- --no-daemon --stacktrace

      - name: Assemble debug APK
        run: npm --prefix apps/mobile run build:debug -- --no-daemon

      - name: Verify debug APK exists
        run: |
          set -e
          ls -la apps/mobile/android/app/build/outputs/apk/debug/
          APK="$(find apps/mobile/android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "::error::assembleDebug produced no APK"; exit 1; }
          # Absolute, because `npm --prefix apps/mobile run ...` executes with the working directory
          # set to apps/mobile, where a repository-root-relative path does not resolve.
          echo "Debug APK: $(realpath "$APK")"

      - name: Secret audit of the debug APK
        run: |
          set -e
          APK="$(realpath "$(find apps/mobile/android/app/build/outputs/apk/debug -name '*.apk' -print -quit)")"
          npm --prefix apps/mobile run audit:artifact -- --app-env debug --format github --report-json "$RUNNER_TEMP/debug-audit.json" "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: sharpmind-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Kotlin test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sharpmind-android-unit-test-reports
          path: apps/mobile/android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  android-qa:
    name: Standalone QA APK (no Metro)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    env:
      # Public client config. These are NOT secrets (a backend URL and the Supabase publishable
      # key), so a repository *variable* is the natural home - but the same name is also accepted
      # as a secret, because whoever configures the repository should not have to remember which
      # of the two it belongs in. The generator's own precedence is preserved: SHARPMIND_* wins
      # over NEXT_PUBLIC_*, and both win over apps/mobile/config/production.json.
      SHARPMIND_API_URL: ${{ vars.SHARPMIND_API_URL || secrets.SHARPMIND_API_URL }}
      SHARPMIND_SUPABASE_URL: ${{ vars.SHARPMIND_SUPABASE_URL || secrets.SHARPMIND_SUPABASE_URL }}
      SHARPMIND_SUPABASE_ANON_KEY: ${{ vars.SHARPMIND_SUPABASE_ANON_KEY || secrets.SHARPMIND_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      SHARPMIND_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate public client configuration for a distributed build
        # Fails with an actionable message naming the missing NON-SECRET value. Never prints a secret.
        run: npm --prefix apps/mobile run check:config -- --app-env qa

      - name: Build standalone QA APK
        run: npm --prefix apps/mobile run build:qa -- --no-daemon --stacktrace

      - name: Verify the React Native bundle is inside the QA APK
        run: |
          set -e
          APK="$(find apps/mobile/android/app/build/outputs/apk/qaStandalone -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "::error::assembleQaStandalone produced no APK"; exit 1; }
          APK="$(realpath "$APK")"
          echo "QA APK: $APK"
          unzip -l "$APK" | grep -E '(^| )assets/index\.android\.bundle$' \
            || { echo "::error::The QA APK does not contain assets/index.android.bundle, so it would still need Metro"; exit 1; }
          echo "The QA APK embeds its own React Native bundle and needs no Metro, no USB and no developer machine."

      - name: Secret and configuration audit of the QA APK
        run: |
          set -e
          # Absolute: `npm --prefix apps/mobile run ...` runs with cwd = apps/mobile.
          APK="$(realpath "$(find apps/mobile/android/app/build/outputs/apk/qaStandalone -name '*.apk' -print -quit)")"
          npm --prefix apps/mobile run audit:artifact -- --app-env qa --format github --report-json "$RUNNER_TEMP/qa-audit.json" "$APK"

      - name: Upload QA APK
        uses: actions/upload-artifact@v7
        with:
          name: sharpmind-android-qa-apk
          path: apps/mobile/android/app/build/outputs/apk/qaStandalone/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload QA audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sharpmind-android-qa-audit
          path: ${{ runner.temp }}/qa-audit.json
          if-no-files-found: ignore
          retention-days: 14

  android-release:
    name: Production release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [android-debug, android-qa]
    # Runs on main pushes and on manual dispatch with production_release=true.
    # It requires the full signing secret set and FAILS if any of them is missing.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.production_release)
    environment: production
    env:
      # Public client config. These are NOT secrets (a backend URL and the Supabase publishable
      # key), so a repository *variable* is the natural home - but the same name is also accepted
      # as a secret, because whoever configures the repository should not have to remember which
      # of the two it belongs in. The generator's own precedence is preserved: SHARPMIND_* wins
      # over NEXT_PUBLIC_*, and both win over apps/mobile/config/production.json.
      SHARPMIND_API_URL: ${{ vars.SHARPMIND_API_URL || secrets.SHARPMIND_API_URL }}
      SHARPMIND_SUPABASE_URL: ${{ vars.SHARPMIND_SUPABASE_URL || secrets.SHARPMIND_SUPABASE_URL }}
      SHARPMIND_SUPABASE_ANON_KEY: ${{ vars.SHARPMIND_SUPABASE_ANON_KEY || secrets.SHARPMIND_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      # versionCode = run_number + SHARPMIND_VERSION_CODE_OFFSET (repository variable, default 0).
      # Raise the offset if the workflow is ever recreated so Play never sees a reused versionCode.
      SHARPMIND_VERSION_CODE_OFFSET: ${{ vars.SHARPMIND_VERSION_CODE_OFFSET }}
      SHARPMIND_VERSION_NAME: ${{ vars.SHARPMIND_VERSION_NAME }}
      SHARPMIND_KEYSTORE_PASSWORD: ${{ secrets.SHARPMIND_KEYSTORE_PASSWORD }}
      SHARPMIND_KEY_ALIAS: ${{ secrets.SHARPMIND_KEY_ALIAS }}
      SHARPMIND_KEY_PASSWORD: ${{ secrets.SHARPMIND_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve deterministic versionCode
        run: |
          set -e
          offset="${SHARPMIND_VERSION_CODE_OFFSET:-0}"
          case "$offset" in ''|*[!0-9]*) echo "::error::SHARPMIND_VERSION_CODE_OFFSET must be a non-negative integer"; exit 1;; esac
          code=$(( ${{ github.run_number }} + offset ))
          echo "SHARPMIND_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "versionCode=$code (run_number ${{ github.run_number }} + offset $offset)"

      - name: Require the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHARPMIND_KEYSTORE_BASE64 }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing SHARPMIND_KEYSTORE_BASE64"
          [ -z "$SHARPMIND_KEYSTORE_PASSWORD" ] && missing="$missing SHARPMIND_KEYSTORE_PASSWORD"
          [ -z "$SHARPMIND_KEY_ALIAS" ] && missing="$missing SHARPMIND_KEY_ALIAS"
          [ -z "$SHARPMIND_KEY_PASSWORD" ] && missing="$missing SHARPMIND_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Production release blocked::Missing signing secrets:$missing. These live only in the 'production' GitHub environment and are never committed. A Play Store release is never signed with the debug keystore."
            exit 1
          fi
          echo "Signing configuration present. versionCode=$SHARPMIND_VERSION_CODE versionName=${SHARPMIND_VERSION_NAME:-package.json}"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate public client configuration for a Play release
        # Fails with an actionable message naming the missing NON-SECRET value. Never prints a secret.
        run: npm --prefix apps/mobile run check:config -- --app-env release

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHARPMIND_KEYSTORE_BASE64 }}
        run: |
          set -e
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sharpmind-release.keystore"
          test -s "$RUNNER_TEMP/sharpmind-release.keystore" || { echo "::error::Decoded keystore is empty"; exit 1; }
          echo "SHARPMIND_KEYSTORE_PATH=$RUNNER_TEMP/sharpmind-release.keystore" >> "$GITHUB_ENV"

      - name: Bundle signed release AAB
        run: npm --prefix apps/mobile run bundle -- --no-daemon --stacktrace

      - name: Verify the AAB exists and embeds the React Native bundle
        run: |
          set -e
          AAB="$(find apps/mobile/android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$AAB" || { echo "::error::bundleRelease produced no AAB"; exit 1; }
          AAB="$(realpath "$AAB")"
          echo "AAB: $AAB"
          unzip -l "$AAB" | grep -E '(^| )base/assets/index\.android\.bundle$' \
            || { echo "::error::The AAB does not contain base/assets/index.android.bundle, so it would still need Metro"; exit 1; }
          echo "The release AAB embeds its own Hermes-compiled React Native bundle."

      - name: Verify the AAB is signed with the upload key and not the debug key
        run: |
          set -e
          AAB="$(realpath "$(find apps/mobile/android/app/build/outputs/bundle/release -name '*.aab' -print -quit)")"
          SIG="$(unzip -Z1 "$AAB" | grep -E '^META-INF/[^/]+\.(RSA|DSA|EC)$' | head -1 || true)"
          if [ -z "$SIG" ]; then
            echo "::error::The release AAB carries no signing certificate. It was not signed with the upload keystore."
            exit 1
          fi
          CERT="$(unzip -p "$AAB" "$SIG" | keytool -printcert 2>/dev/null || true)"
          if [ -z "$CERT" ]; then
            echo "::error::Could not read the signing certificate from $SIG"
            exit 1
          fi
          if printf '%s' "$CERT" | grep -qi 'CN=Android Debug'; then
            echo "::error::Release AAB is signed with the Android debug certificate. A Play artifact must be signed with the upload keystore."
            exit 1
          fi
          # Only the certificate subject/fingerprint is printed - that information is public in
          # every distributed artifact. Keystore material and passwords are never echoed.
          printf '%s\n' "$CERT" | grep -E '^(Owner|Issuer|SHA256):' | sed 's/^/AAB signing certificate -> /'

      - name: Secret and configuration audit of the release AAB
        run: |
          set -e
          # Absolute: `npm --prefix apps/mobile run ...` runs with cwd = apps/mobile.
          AAB="$(realpath "$(find apps/mobile/android/app/build/outputs/bundle/release -name '*.aab' -print -quit)")"
          npm --prefix apps/mobile run audit:artifact -- --app-env release --format github --report-json "$RUNNER_TEMP/release-audit.json" "$AAB"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/sharpmind-release.keystore"

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: sharpmind-android-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload release audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sharpmind-android-release-audit
          path: ${{ runner.temp }}/release-audit.json
          if-no-files-found: ignore
          retention-days: 30
