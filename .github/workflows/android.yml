name: Android app

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and JS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Mobile typecheck
        run: npm run mobile:typecheck

      - name: Mobile tests
        run: npm run mobile:test

      - name: Web typecheck
        run: npm --prefix apps/web run typecheck

  android:
    name: Kotlin tests, debug APK, release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      SHARPMIND_VERSION_CODE: ${{ github.run_number }}
      SHARPMIND_KEYSTORE_PASSWORD: ${{ secrets.SHARPMIND_KEYSTORE_PASSWORD }}
      SHARPMIND_KEY_ALIAS: ${{ secrets.SHARPMIND_KEY_ALIAS }}
      SHARPMIND_KEY_PASSWORD: ${{ secrets.SHARPMIND_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check client configuration
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] || [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "::warning title=Unconfigured client::Supabase or API secrets are missing. The APK can be installed, but sign-in and data calls stay disabled until NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, and NEXT_PUBLIC_API_URL are set."
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHARPMIND_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$SHARPMIND_KEYSTORE_PASSWORD" ] || [ -z "$SHARPMIND_KEY_ALIAS" ] || [ -z "$SHARPMIND_KEY_PASSWORD" ]; then
            echo "::warning title=Release AAB skipped::Set SHARPMIND_KEYSTORE_BASE64, SHARPMIND_KEYSTORE_PASSWORD, SHARPMIND_KEY_ALIAS, and SHARPMIND_KEY_PASSWORD to upload a signed release bundle. Debug APK still builds."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sharpmind-release.keystore"
          echo "SHARPMIND_KEYSTORE_PATH=$RUNNER_TEMP/sharpmind-release.keystore" >> "$GITHUB_ENV"
          echo "SHARPMIND_HAS_RELEASE_KEYSTORE=1" >> "$GITHUB_ENV"

      - name: Kotlin unit tests
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: sharpmind-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Bundle release AAB
        if: env.SHARPMIND_HAS_RELEASE_KEYSTORE == '1'
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload release AAB
        if: env.SHARPMIND_HAS_RELEASE_KEYSTORE == '1'
        uses: actions/upload-artifact@v7
        with:
          name: sharpmind-android-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
