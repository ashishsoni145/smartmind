# TEMPORARY diagnostic workflow - deleted once the Android CI failure is diagnosed.
# Runs several settings.gradle variants and posts the filtered Gradle output on the pull
# request so it can be read from an environment that cannot reach
# results-receiver.actions.githubusercontent.com.
name: Android debug log (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gradle-log:
    name: Capture Gradle log
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install layout
        continue-on-error: true
        run: |
          ls -la apps/mobile/node_modules/@react-native/ 2>&1 | head
          readlink -f apps/mobile/node_modules/@react-native/gradle-plugin || true
          ls node_modules/@react-native/gradle-plugin | head -5

      - name: Run variants
        continue-on-error: true
        run: |
          {
          SETTINGS=apps/mobile/android/settings.gradle
          cp "$SETTINGS" /tmp/settings.mine.gradle
          run_variant () {
            name="$1"
            echo "===== variant $name ====="
            npm --prefix apps/mobile run gradle -- projects --no-daemon --stacktrace > "/tmp/raw-$name.log" 2>&1
            echo "exit=$?"
            grep -vE '^[[:space:]]+at ' "/tmp/raw-$name.log" | grep -vE '^[[:space:]]*$' | head -25
            echo "-----"
          }

          # V0: the committed settings.gradle (control)
          run_variant V0

          # V1: minimal RN-template style, relative String, single includeBuild
          cat > "$SETTINGS" <<'EOF'
          pluginManagement { includeBuild("../../../node_modules/@react-native/gradle-plugin") }
          plugins { id("com.facebook.react.settings") }
          rootProject.name = 'SharpMind'
          EOF
          run_variant V1

          # V2: RN-template style with the settings-level includeBuild as well
          cat > "$SETTINGS" <<'EOF'
          pluginManagement { includeBuild("../../../node_modules/@react-native/gradle-plugin") }
          plugins { id("com.facebook.react.settings") }
          rootProject.name = 'SharpMind'
          includeBuild('../../../node_modules/@react-native/gradle-plugin')
          EOF
          run_variant V2

          # V3: canonical File object inside pluginManagement
          cat > "$SETTINGS" <<'EOF'
          pluginManagement { includeBuild(new File(rootDir, "../../../node_modules/@react-native/gradle-plugin").canonicalFile) }
          plugins { id("com.facebook.react.settings") }
          rootProject.name = 'SharpMind'
          includeBuild(new File(rootDir, "../../../node_modules/@react-native/gradle-plugin").canonicalFile)
          EOF
          run_variant V3

          # V4: mobile symlink path (what the old settings.gradle found first)
          cat > "$SETTINGS" <<'EOF'
          pluginManagement { includeBuild(new File(rootDir, "../node_modules/@react-native/gradle-plugin").canonicalFile) }
          plugins { id("com.facebook.react.settings") }
          rootProject.name = 'SharpMind'
          includeBuild(new File(rootDir, "../node_modules/@react-native/gradle-plugin").canonicalFile)
          EOF
          run_variant V4

          cp /tmp/settings.mine.gradle "$SETTINGS"
          } 2>&1 | tee /tmp/variants-report.txt

      - name: Post logs to the pull request
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          jq -Rs '{body: ("```\n" + . + "\n```")}' /tmp/variants-report.txt > comment.json 2>/dev/null || echo '{"body":"no report"}' > comment.json
          gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --input comment.json
