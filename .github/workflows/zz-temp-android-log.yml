# TEMPORARY diagnostic workflow - deleted once the Android CI failure is diagnosed.
# Runs the real Kotlin unit test and debug APK commands and posts the filtered Gradle
# output on the pull request so it can be read from an environment that cannot reach
# results-receiver.actions.githubusercontent.com.
name: Android debug log (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gradle-log:
    name: Capture Gradle log
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the Android build
        continue-on-error: true
        run: |
          set +e
          {
            echo "===== gradle projects (sanity) ====="
            npm --prefix apps/mobile run gradle -- projects --no-daemon --stacktrace > /tmp/raw-projects.log 2>&1
            echo "exit=$?"
            grep -vE '^[[:space:]]+at ' /tmp/raw-projects.log | grep -vE '^> Task ' | grep -vE '^[[:space:]]*$' | head -30

            echo "===== testDebugUnitTest ====="
            npm --prefix apps/mobile run test:android -- --no-daemon --stacktrace > /tmp/raw-test.log 2>&1
            echo "exit=$?"
            grep -vE '^[[:space:]]+at ' /tmp/raw-test.log | grep -vE '^> Task ' | grep -vE '^[[:space:]]*$' | head -80

            echo "===== assembleDebug ====="
            npm --prefix apps/mobile run build:debug -- --no-daemon --stacktrace > /tmp/raw-build.log 2>&1
            echo "exit=$?"
            grep -vE '^[[:space:]]+at ' /tmp/raw-build.log | grep -vE '^> Task ' | grep -vE '^[[:space:]]*$' | head -80

            echo "===== APK output ====="
            ls -la apps/mobile/android/app/build/outputs/apk/debug/ 2>&1
          } 2>&1 | tee /tmp/report.txt

      - name: Post logs to the pull request
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          tail -c 50000 /tmp/report.txt > /tmp/report-tail.txt
          jq -Rs '{body: ("```\n" + . + "\n```")}' /tmp/report-tail.txt > comment.json
          gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --input comment.json
