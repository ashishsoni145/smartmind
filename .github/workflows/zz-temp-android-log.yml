# TEMPORARY diagnostic workflow - deleted once the Android CI failure is diagnosed.
# Re-runs the same Gradle entry points as the "Kotlin tests and debug APK" job and posts
# the captured output on the pull request so it can be read from an environment that
# cannot reach results-receiver.actions.githubusercontent.com.
name: Android debug log (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gradle-log:
    name: Capture Gradle log
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Show install layout
        continue-on-error: true
        run: |
          echo "--- apps/mobile/node_modules/@react-native ---"
          ls -la apps/mobile/node_modules/@react-native/ 2>&1 | head -20
          echo "--- readlink -f (canonical) ---"
          readlink -f apps/mobile/node_modules/@react-native/gradle-plugin || true
          echo "--- root plugin dir ---"
          ls node_modules/@react-native/gradle-plugin | head -20
        id: layout

      - name: Probe C - default resolution
        continue-on-error: true
        run: |
          npm --prefix apps/mobile run gradle -- projects --no-daemon --stacktrace 2>&1 | tail -c 12000 | tee probeC.log

      - name: Probe A - explicit canonical path
        continue-on-error: true
        run: |
          CANON=$(readlink -f apps/mobile/node_modules/@react-native/gradle-plugin)
          echo "canonical=$CANON"
          npm --prefix apps/mobile run gradle -- projects --no-daemon --stacktrace -PreactNativeGradlePluginDir="$CANON" 2>&1 | tail -c 12000 | tee probeA.log

      - name: Probe B - explicit symlink path
        continue-on-error: true
        run: |
          npm --prefix apps/mobile run gradle -- projects --no-daemon --stacktrace -PreactNativeGradlePluginDir=apps/mobile/node_modules/@react-native/gradle-plugin 2>&1 | tail -c 12000 | tee probeB.log

      - name: Post logs to the pull request
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Probe C - default resolution (no -P override)"; echo; echo '```';
            cat probeC.log 2>/dev/null || echo "(no output)";
            echo '```';
            echo; echo "### Probe A - explicit canonical path"; echo; echo '```';
            cat probeA.log 2>/dev/null || echo "(no output)";
            echo '```';
            echo; echo "### Probe B - explicit symlink path"; echo; echo '```';
            cat probeB.log 2>/dev/null || echo "(no output)";
            echo '```';
          } > report.md
          tail -c 60000 report.md > report-tail.md
          jq -Rs '{body: .}' report-tail.md > comment.json
          gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --input comment.json
