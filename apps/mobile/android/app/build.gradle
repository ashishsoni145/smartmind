apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def mobileNodeModules = file("../../node_modules")
def repoNodeModules = file("../../../node_modules")

def resolveNodePackage = { String name ->
    [new File(mobileNodeModules, name), new File(repoNodeModules, name)].find { it.exists() }
}

def resolvedRnDir = resolveNodePackage("react-native")
def resolvedCodegenDir = resolveNodePackage("@react-native/codegen")

/**
 * React Native Android configuration.
 * JS lives in apps/mobile. Native modules may be hoisted to the monorepo root.
 * nodeExecutableAndArgs is the node binary list, not a shell. Public config is written by writePublicConfig.
 */
react {
    root = file("../../")
    if (resolvedRnDir != null) {
        reactNativeDir = resolvedRnDir
    }
    if (resolvedCodegenDir != null) {
        codegenDir = resolvedCodegenDir
    }
    if (resolvedRnDir != null) {
        cliFile = new File(resolvedRnDir, "cli.js")
    }
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def mobilePackage = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def appVersionName = System.getenv('SHARPMIND_VERSION_NAME') ?: mobilePackage.version
def appVersionCode = (System.getenv('SHARPMIND_VERSION_CODE') ?: '1') as Integer
def releaseKeystore = System.getenv('SHARPMIND_KEYSTORE_PATH')
def hasReleaseSigning = releaseKeystore && file(releaseKeystore).exists()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.sharpmind.app"
    defaultConfig {
        applicationId "com.sharpmind.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "SHARPMIND_APP_ENV", "\"debug\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('SHARPMIND_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SHARPMIND_KEY_ALIAS')
                keyPassword System.getenv('SHARPMIND_KEY_PASSWORD')
            } else {
                // CI and local verification can produce an installable AAB without a
                // production keystore. Play upload requires SHARPMIND_KEYSTORE_*.
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            buildConfigField "String", "SHARPMIND_APP_ENV", "\"debug\""
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            buildConfigField "String", "SHARPMIND_APP_ENV", "\"release\""
        }
    }
    buildFeatures {
        buildConfig true
    }
    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE", "META-INF/LICENSE.txt", "META-INF/NOTICE", "META-INF/NOTICE.txt"]
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.core:core-ktx:1.16.0")
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("androidx.security:security-crypto:1.1.0-alpha06")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:core:1.6.1"
}

tasks.register("writePublicConfig", Exec) {
    workingDir file("../../")
    commandLine "node", "scripts/write-public-config.mjs"
}

preBuild.dependsOn("writePublicConfig")
